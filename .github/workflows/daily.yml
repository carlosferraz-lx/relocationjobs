name: Daily job finder

on:
  schedule:
    - cron: "0 6 * * *"        # every day at 06:00 UTC
  workflow_dispatch: {}          # allow manual runs from the Actions tab

# Commit the refreshed digest + state, and push the dashboard to gh-pages.
permissions:
  contents: write

concurrency:
  group: daily-job-finder
  cancel-in-progress: true

jobs:
  find-jobs:
    name: Fetch, update digest, and publish dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the job finder
        env:
          # Optional: set these repo secrets to enable Adzuna (UK salary data).
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m jobfinder.run --state data/seen_jobs.json -v

      - name: Commit digest and state
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add REPORT.md data/seen_jobs.json
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "chore: daily job digest [skip ci]"
            git push
          fi

      - name: Publish dashboard to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./docs
          publish_branch: gh-pages
